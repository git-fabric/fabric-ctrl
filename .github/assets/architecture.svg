<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" fill="none">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="900" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="a-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="a-glow-strong">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="a-clip">
      <rect x="2" y="2" width="896" height="516" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="url(#a-bg)"/>
  <rect x="1" y="1" width="898" height="518" rx="15" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Subtle grid -->
  <g clip-path="url(#a-clip)" opacity="0.03">
    <line x1="0" y1="100" x2="900" y2="100" stroke="#58a6ff"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#58a6ff"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="#58a6ff"/>
    <line x1="0" y1="400" x2="900" y2="400" stroke="#58a6ff"/>
    <line x1="225" y1="0" x2="225" y2="520" stroke="#58a6ff"/>
    <line x1="450" y1="0" x2="450" y2="520" stroke="#58a6ff"/>
    <line x1="675" y1="0" x2="675" y2="520" stroke="#58a6ff"/>
  </g>

  <!-- Title -->
  <text x="450" y="36" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="14" fill="#8b949e" text-anchor="middle" letter-spacing="3" opacity="0.6">ARCHITECTURE</text>

  <!-- ═══════════ TIER 1: CONSUMERS ═══════════ -->
  <text x="40" y="72" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#484f58" letter-spacing="2">CONSUMERS</text>

  <!-- Claude Desktop -->
  <rect x="80" y="82" width="160" height="44" rx="8" fill="#0d1117" stroke="#bc8cff" stroke-width="1" opacity="0.8"/>
  <circle cx="102" cy="104" r="8" fill="none" stroke="#bc8cff" stroke-width="1" opacity="0.5"/>
  <text x="100" y="108" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#bc8cff" text-anchor="middle">C</text>
  <text x="120" y="100" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#e6edf3">Claude Desktop</text>
  <text x="120" y="115" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#484f58">MCP host</text>

  <!-- git-steer -->
  <rect x="280" y="82" width="160" height="44" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1" opacity="0.8"/>
  <text x="310" y="100" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#e6edf3">git-steer</text>
  <text x="310" y="115" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#484f58">automation</text>

  <!-- cortex -->
  <rect x="480" y="82" width="160" height="44" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.8"/>
  <text x="510" y="100" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#e6edf3">cortex</text>
  <text x="510" y="115" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#484f58">orchestration</text>

  <!-- GitHub -->
  <rect x="680" y="82" width="160" height="44" rx="8" fill="#0d1117" stroke="#f0883e" stroke-width="1" opacity="0.8"/>
  <text x="710" y="100" font-family="'SF Mono', Consolas, monospace" font-size="11" fill="#e6edf3">GitHub</text>
  <text x="710" y="115" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#484f58">webhook events</text>

  <!-- ═══════════ CONNECTOR LINES: Consumers → fabric-ctrl ═══════════ -->
  <!-- Animated data pulses going down -->
  <g>
    <!-- Claude → MCP -->
    <line x1="160" y1="126" x2="350" y2="190" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
    <circle r="3" fill="#bc8cff" opacity="0">
      <animate attributeName="cx" values="160;350" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="126;190" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- git-steer → MCP -->
    <line x1="360" y1="126" x2="350" y2="190" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
    <circle r="3" fill="#58a6ff" opacity="0">
      <animate attributeName="cx" values="360;350" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="126;190" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>

    <!-- cortex → MCP -->
    <line x1="560" y1="126" x2="350" y2="190" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
    <circle r="3" fill="#3fb950" opacity="0">
      <animate attributeName="cx" values="560;350" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="126;190" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>

    <!-- GitHub → Webhook -->
    <line x1="760" y1="126" x2="620" y2="190" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4"/>
    <circle r="3" fill="#f0883e" opacity="0">
      <animate attributeName="cx" values="760;620" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="126;190" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ═══════════ TIER 2: FABRIC-CTRL ═══════════ -->
  <text x="40" y="180" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#484f58" letter-spacing="2">FABRIC-CTRL</text>

  <!-- MCP Server box -->
  <rect x="200" y="190" width="300" height="70" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="220" y="215" font-family="'SF Mono', Consolas, monospace" font-size="13" fill="#58a6ff" font-weight="600">MCP Server</text>
  <text x="220" y="233" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#8b949e">stdio transport</text>
  <text x="220" y="248" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#484f58">org__list_repos | org__security | org__audit</text>

  <!-- Webhook Server box -->
  <rect x="530" y="190" width="300" height="70" rx="10" fill="#0d1117" stroke="#f0883e" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="550" y="215" font-family="'SF Mono', Consolas, monospace" font-size="13" fill="#f0883e" font-weight="600">Webhook Server</text>
  <text x="550" y="233" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#8b949e">Hono HTTP</text>
  <text x="550" y="248" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#484f58">push | scan | vuln | deps | audit</text>

  <!-- Shared identity connector -->
  <line x1="500" y1="215" x2="530" y2="215" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="515" y="210" font-family="'SF Mono', Consolas, monospace" font-size="8" fill="#388bfd" text-anchor="middle" opacity="0.6">1 ID</text>

  <!-- ═══════════ TIER 3: GITHUB APP ═══════════ -->
  <text x="40" y="300" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#484f58" letter-spacing="2">IDENTITY</text>

  <!-- Lines down from fabric-ctrl to GitHub App -->
  <line x1="350" y1="260" x2="450" y2="310" stroke="#30363d" stroke-width="1"/>
  <line x1="680" y1="260" x2="450" y2="310" stroke="#30363d" stroke-width="1"/>

  <!-- GitHub App box with shield -->
  <rect x="300" y="310" width="300" height="60" rx="10" fill="#0d1117" stroke="#388bfd" stroke-width="2">
    <animate attributeName="stroke" values="#388bfd;#58a6ff;#388bfd" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- Shield mini-icon -->
  <path d="M322 325 L335 331 L335 343 C335 351 330 356 322 360 C314 356 309 351 309 343 L309 331 Z"
        fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.7"/>
  <circle cx="322" cy="343" r="2" fill="#58a6ff" opacity="0.8"/>
  <text x="345" y="337" font-family="'SF Mono', Consolas, monospace" font-size="14" fill="#e6edf3" font-weight="700">fabric-security</text>
  <text x="345" y="355" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#8b949e">GitHub App &middot; HMAC-SHA256 &middot; short-lived tokens</text>

  <!-- Animated verification pulse around GitHub App -->
  <rect x="298" y="308" width="304" height="64" rx="12" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;3;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══════════ TIER 4: GIT-FABRIC ORG ═══════════ -->
  <text x="40" y="414" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#484f58" letter-spacing="2">GIT-FABRIC ORG</text>

  <!-- Line from GitHub App to org -->
  <line x1="450" y1="370" x2="450" y2="420" stroke="#30363d" stroke-width="1"/>
  <text x="458" y="398" font-family="'SF Mono', Consolas, monospace" font-size="8" fill="#484f58">installed on</text>

  <!-- Repo boxes - row 1 -->
  <g>
    <rect x="55" y="424" width="105" height="36" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="75" y="447" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#3fb950">unifi</text>

    <rect x="170" y="424" width="105" height="36" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <text x="190" y="447" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#3fb950">proxmox</text>

    <rect x="285" y="424" width="105" height="36" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="305" y="447" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#3fb950">k8s</text>

    <rect x="400" y="424" width="105" height="36" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
    <text x="420" y="447" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#3fb950">sandfly</text>

    <rect x="515" y="424" width="105" height="36" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="535" y="447" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#3fb950">cloudflare</text>

    <rect x="630" y="424" width="105" height="36" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="650" y="447" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#3fb950">tailscale</text>

    <rect x="745" y="424" width="105" height="36" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="765" y="447" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#3fb950">cve</text>
  </g>

  <!-- Repo boxes - row 2 -->
  <g>
    <rect x="170" y="470" width="105" height="36" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" begin="2.1s" repeatCount="indefinite"/>
    </rect>
    <text x="190" y="493" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#3fb950">git</text>

    <rect x="285" y="470" width="105" height="36" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="305" y="493" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#3fb950">chat</text>

    <rect x="400" y="470" width="105" height="36" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" begin="2.7s" repeatCount="indefinite"/>
    </rect>
    <text x="420" y="493" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#3fb950">gateway</text>

    <rect x="515" y="470" width="105" height="36" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="4s" begin="3s" repeatCount="indefinite"/>
    </rect>
    <text x="535" y="493" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#3fb950">aiana</text>

    <rect x="630" y="470" width="105" height="36" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="650" y="493" font-family="'SF Mono', Consolas, monospace" font-size="10" fill="#58a6ff" font-weight="600">fabric-ctrl</text>
  </g>

  <!-- Connection lines from org center to repos -->
  <g opacity="0.15">
    <line x1="450" y1="420" x2="107" y2="424" stroke="#3fb950"/>
    <line x1="450" y1="420" x2="222" y2="424" stroke="#3fb950"/>
    <line x1="450" y1="420" x2="337" y2="424" stroke="#3fb950"/>
    <line x1="450" y1="420" x2="452" y2="424" stroke="#3fb950"/>
    <line x1="450" y1="420" x2="567" y2="424" stroke="#3fb950"/>
    <line x1="450" y1="420" x2="682" y2="424" stroke="#3fb950"/>
    <line x1="450" y1="420" x2="797" y2="424" stroke="#3fb950"/>
  </g>
</svg>
