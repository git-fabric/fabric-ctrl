<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" fill="none">
  <defs>
    <style>
      @keyframes flowPulse { 0%, 100% { stroke-dashoffset: 24; } }
      @keyframes flowRight { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
      @keyframes borderPulse { 0%, 100% { stroke-opacity: 0.6; } 50% { stroke-opacity: 1; } }
      @keyframes appPulse { 0%, 100% { stroke: #388bfd; } 50% { stroke: #58a6ff; } }
      @keyframes verifyPulse { 0%, 100% { opacity: 0; stroke-width: 1px; } 50% { opacity: 0.3; stroke-width: 3px; } }
      @keyframes repoPulse1 { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 0.8; } }
      @keyframes repoPulse2 { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 0.8; } }
      @keyframes repoPulse3 { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 0.8; } }
      @keyframes repoPulse4 { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 0.8; } }
      @keyframes repoPulse5 { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 0.8; } }
      @keyframes repoPulse6 { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 0.8; } }
      @keyframes repoPulse7 { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 0.8; } }
      @keyframes ctrlPulse { 0%, 100% { stroke-opacity: 0.6; } 50% { stroke-opacity: 1; } }
      .flow-line { stroke-dasharray: 12 12; animation: flowRight 1.5s linear infinite; }
      .mcp-box { animation: borderPulse 3s ease-in-out infinite; }
      .wh-box { animation: borderPulse 3s ease-in-out 1.5s infinite; }
      .app-box { animation: appPulse 4s ease-in-out infinite; }
      .app-ring { animation: verifyPulse 3s ease-in-out infinite; }
      .r1 { animation: repoPulse1 4s ease-in-out infinite; }
      .r2 { animation: repoPulse2 4s ease-in-out 0.3s infinite; }
      .r3 { animation: repoPulse3 4s ease-in-out 0.6s infinite; }
      .r4 { animation: repoPulse4 4s ease-in-out 0.9s infinite; }
      .r5 { animation: repoPulse5 4s ease-in-out 1.2s infinite; }
      .r6 { animation: repoPulse6 4s ease-in-out 1.5s infinite; }
      .r7 { animation: repoPulse7 4s ease-in-out 1.8s infinite; }
      .ctrl-box { animation: ctrlPulse 2s ease-in-out infinite; }
    </style>
    <linearGradient id="a-bg" x1="0" y1="0" x2="900" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" rx="16" fill="url(#a-bg)"/>
