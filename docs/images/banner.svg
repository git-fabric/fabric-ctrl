<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" fill="none">
  <defs>
    <style>
      @keyframes pulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.25; } }
      @keyframes shieldPulse { 0%, 100% { opacity: 0; stroke-width: 1px; } 50% { opacity: 0.4; stroke-width: 4px; } }
      @keyframes nodePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
      @keyframes flowDown { 0% { transform: translateY(-140px); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(0); opacity: 0; } }
      @keyframes drift1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(700px, 140px); } }
      @keyframes drift2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-500px, -120px); } }
      @keyframes drift3 { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(-300px, -50px); } 66% { transform: translate(400px, 50px); } }
      .shield-body { animation: pulse 3s ease-in-out infinite; }
      .shield-ring { animation: shieldPulse 3s ease-in-out infinite; }
      .n1 { animation: nodePulse 2s ease-in-out infinite; transform-origin: 720px 50px; }
      .n2 { animation: nodePulse 2s ease-in-out 0.4s infinite; transform-origin: 720px 80px; }
      .n3 { animation: nodePulse 2s ease-in-out 0.8s infinite; transform-origin: 720px 110px; }
      .n4 { animation: nodePulse 2s ease-in-out 1.2s infinite; transform-origin: 720px 140px; }
      .n5 { animation: nodePulse 2s ease-in-out 1.6s infinite; transform-origin: 720px 170px; }
      .data-pulse { animation: flowDown 2s linear infinite; }
      .p1 { animation: drift1 12s linear infinite; }
      .p2 { animation: drift2 10s linear infinite; }
      .p3 { animation: drift3 16s linear infinite; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="sf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#388bfd"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="198" rx="15" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Particles -->
  <circle cx="100" cy="30" r="1.5" fill="#58a6ff" opacity="0.4" class="p1"/>
  <circle cx="700" cy="160" r="1" fill="#bc8cff" opacity="0.3" class="p2"/>
  <circle cx="400" cy="100" r="1.5" fill="#ff7b72" opacity="0.3" class="p3"/>

  <!-- Shield -->
  <g transform="translate(80, 58)">
    <path d="M40 0 L75 15 L75 45 C75 68 60 82 40 90 C20 82 5 68 5 45 L5 15 Z" fill="url(#sf)" stroke="#58a6ff" stroke-width="1.5" class="shield-body"/>
    <path d="M40 8 L70 20 L70 45 C70 64 57 76 40 83 C23 76 10 64 10 45 L10 20 Z" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.6"/>
    <rect x="28" y="38" width="24" height="18" rx="3" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>
    <path d="M33 38 L33 30 C33 24 47 24 47 30 L47 38" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>
    <circle cx="40" cy="48" r="2.5" fill="#58a6ff" opacity="0.9"/>
    <path d="M40 0 L75 15 L75 45 C75 68 60 82 40 90 C20 82 5 68 5 45 L5 15 Z" fill="none" stroke="#58a6ff" class="shield-ring"/>
  </g>

  <!-- Title -->
  <text x="195" y="95" font-family="'SF Mono','Fira Code','JetBrains Mono',Consolas,monospace" font-size="52" font-weight="700" fill="#e6edf3" letter-spacing="-1">fabric-ctrl</text>
  <text x="195" y="130" font-family="'SF Mono','Fira Code','JetBrains Mono',Consolas,monospace" font-size="16" fill="#8b949e" letter-spacing="0.5">zero-trust control plane for git-fabric</text>

  <!-- Badges -->
  <g transform="translate(195, 145)">
    <rect x="0" y="0" width="56" height="22" rx="11" fill="#388bfd" opacity="0.15" stroke="#388bfd" stroke-width="0.5"/>
    <text x="28" y="15" font-family="'SF Mono',Consolas,monospace" font-size="10" fill="#58a6ff" text-anchor="middle">MCP</text>
    <rect x="66" y="0" width="80" height="22" rx="11" fill="#388bfd" opacity="0.15" stroke="#388bfd" stroke-width="0.5"/>
    <text x="106" y="15" font-family="'SF Mono',Consolas,monospace" font-size="10" fill="#58a6ff" text-anchor="middle">Webhooks</text>
    <rect x="156" y="0" width="88" height="22" rx="11" fill="#f0883e" opacity="0.15" stroke="#f0883e" stroke-width="0.5"/>
    <text x="200" y="15" font-family="'SF Mono',Consolas,monospace" font-size="10" fill="#f0883e" text-anchor="middle">Zero-Trust</text>
    <rect x="254" y="0" width="92" height="22" rx="11" fill="#bc8cff" opacity="0.15" stroke="#bc8cff" stroke-width="0.5"/>
    <text x="300" y="15" font-family="'SF Mono',Consolas,monospace" font-size="10" fill="#bc8cff" text-anchor="middle">GitHub App</text>
  </g>

  <!-- Right side nodes -->
  <g transform="translate(680, 30)" opacity="0.3">
    <line x1="40" y1="0" x2="40" y2="140" stroke="#30363d" stroke-width="1"/>
    <circle cx="40" cy="20" r="4" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" class="n1"/>
    <circle cx="40" cy="50" r="4" fill="#0d1117" stroke="#bc8cff" stroke-width="1.5" class="n2"/>
    <circle cx="40" cy="80" r="4" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5" class="n3"/>
    <circle cx="40" cy="110" r="4" fill="#0d1117" stroke="#3fb950" stroke-width="1.5" class="n4"/>
    <circle cx="40" cy="140" r="4" fill="#0d1117" stroke="#f0883e" stroke-width="1.5" class="n5"/>
    <line x1="44" y1="20" x2="80" y2="20" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
    <line x1="44" y1="50" x2="80" y2="50" stroke="#bc8cff" stroke-width="1" opacity="0.5"/>
    <line x1="44" y1="80" x2="80" y2="80" stroke="#ff7b72" stroke-width="1" opacity="0.5"/>
    <line x1="44" y1="110" x2="80" y2="110" stroke="#3fb950" stroke-width="1" opacity="0.5"/>
    <line x1="44" y1="140" x2="80" y2="140" stroke="#f0883e" stroke-width="1" opacity="0.5"/>
    <text x="86" y="24" font-family="'SF Mono',Consolas,monospace" font-size="9" fill="#58a6ff" opacity="0.7">push</text>
    <text x="86" y="54" font-family="'SF Mono',Consolas,monospace" font-size="9" fill="#bc8cff" opacity="0.7">scan</text>
    <text x="86" y="84" font-family="'SF Mono',Consolas,monospace" font-size="9" fill="#ff7b72" opacity="0.7">vuln</text>
    <text x="86" y="114" font-family="'SF Mono',Consolas,monospace" font-size="9" fill="#3fb950" opacity="0.7">audit</text>
    <text x="86" y="144" font-family="'SF Mono',Consolas,monospace" font-size="9" fill="#f0883e" opacity="0.7">deps</text>
    <circle cx="40" cy="0" r="2" fill="#58a6ff" class="data-pulse"/>
  </g>
</svg>
